<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精密機械教育中心 | 引領未來工程</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1a1a1a;  /* 工業黑 */
            --accent-orange: #f39c12; /* 機械橘 */
            --gray-text: #bdc3c7;
            --white: #ffffff;
            --overlay: rgba(0, 0, 0, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0d0d0d;
            color: var(--white);
            line-height: 1.6;
        }

        /* 導航欄 */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(26, 26, 26, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--accent-orange);
        }

        .logo {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.8rem;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-links { display: flex; list-style: none; }
        .nav-links li { margin-left: 30px; }
        .nav-links a { 
            color: var(--white); 
            text-decoration: none; 
            font-weight: 400;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--accent-orange); }

        /* 英雄區背景圖 */
        .hero {
            height: 100vh;
            background: linear-gradient(var(--overlay), var(--overlay)), 
                        url('https://images.unsplash.com/photo-1537462715879-360eeb61a0ad?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* 視差捲動效果 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            letter-spacing: 5px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
